<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Emlid-Messfotos verorten, DXF und ALKIS prüfen und GPS-/RTK-Metadaten lokal exportieren." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="canonical" href="https://measuremap-viewer-editor.netlify.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MeasureMap" />
    <meta property="og:description" content="Emlid-Messfotos verorten, DXF und ALKIS prüfen und GPS-/RTK-Metadaten lokal exportieren." />
    <meta property="og:url" content="https://measuremap-viewer-editor.netlify.app/" />
    <title>MeasureMap · v26.32.2</title>
    <script>
      // Interface und Sprache vor dem ersten Zeichnen setzen (kein Aufblitzen). "auto" folgt prefers-color-scheme.
      (function () {
        var root = document.documentElement, saved = {};
        try { saved = JSON.parse(localStorage.getItem('measuremap.preferences') || '{}') || {}; } catch (e) { saved = {}; }
        var mode = saved.theme === 'light' || saved.theme === 'dark' ? saved.theme : 'auto';
        var dark = mode === 'auto' ? !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) : mode === 'dark';
        root.setAttribute('data-theme', dark ? 'dark' : 'light');
        root.classList.toggle('dark', dark);
        root.lang = saved.language === 'en' || saved.language === 'de' ? saved.language : (/^de\b/i.test(navigator.language || '') ? 'de' : 'en');
      })();
    </script>
    <style>
      :root {
        color-scheme: dark;
        --font-ui: "Inter Variable", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
        --font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;
        --accent: #4da3ff;
        --accent-glow: rgba(77, 163, 255, 0.25);
        --bg: #14171c;
        --surface: #1d2229;
        --card: #232a33;
        --border: #333c48;
        --text: #e6ebf1;
      }
      :root[data-theme="light"] {
        color-scheme: light;
        --accent: #1f6fd1;
        --accent-glow: rgba(31, 111, 209, 0.22);
        --bg: #f3f5f8;
        --surface: #ffffff;
        --card: #eef1f5;
        --border: #d4dae2;
        --text: #1b2430;
      }
      body { font-family: var(--font-ui); background-color: var(--bg); color: var(--text); margin: 0; }
      /* Custom scrollbar for raw data views */
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: var(--surface); }
      ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #4a5361; }
      /* Focus glow in the accent color */
      input:focus, select:focus, textarea:focus {
        border-color: var(--accent) !important;
        box-shadow: 0 0 0 3px var(--accent-glow) !important;
      }
      /* Accent color for range sliders */
      input[type="range"]::-webkit-slider-thumb { background: var(--accent); }
      input[type="range"]::-moz-range-thumb { background: var(--accent); }
    </style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
