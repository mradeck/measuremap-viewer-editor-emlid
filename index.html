      // Interface und Sprache vor dem ersten Zeichnen setzen (kein Aufblitzen). "auto" folgt prefers-color-scheme.
      (function () {
        var root = document.documentElement, saved = {};
        try { saved = JSON.parse(localStorage.getItem('measuremap.preferences') || '{}') || {}; } catch (e) { saved = {}; }
        var mode = saved.theme === 'light' || saved.theme === 'dark' ? saved.theme : 'auto';
        var dark = mode === 'auto' ? !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) : mode === 'dark';
        root.setAttribute('data-theme', dark ? 'dark' : 'light');
        root.classList.toggle('dark', dark);
        root.lang = saved.language === 'en' || saved.language === 'de' ? saved.language : (/^de\b/i.test(navigator.language || '') ? 'de' : 'en');
      })();
    </script>
